name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch newly published advisories

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fabulist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fabulist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fabulist -d fabulist_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fabulist:ci-only-password@localhost:5432/fabulist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes app tests
      - name: Tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: for f in app/static/js/*.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
