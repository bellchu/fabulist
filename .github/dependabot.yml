# Version updates arrive as pull requests; they are checked here with scripts/release-check-k8s.sh (the project uses no GitHub Actions).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    labels: [dependencies]
