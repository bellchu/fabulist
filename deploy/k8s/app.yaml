# IMAGE is substituted by scripts/deploy.sh. Secrets "fabulist-db" and
# "fabulist-app" are created by that script and are never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabulist
  namespace: fabulist
spec:
  replicas: 1   # background generation runs in-process; keep a single replica
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # the new pod is ready before the old one is stopped
  selector:
    matchLabels:
      app: fabulist
  template:
    metadata:
      labels:
        app: fabulist
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: 60     # lets in-flight generation runs stop cleanly (see shutdown_runs)
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {}                      # the only writable path: repository clones and upload scratch space
      containers:
        - name: fabulist
          image: IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fabulist-app
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          env:
            - name: HOME
              value: /tmp                   # git writes its config under $HOME
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fabulist-db
                  key: DATABASE_URL
          lifecycle:
            preStop:
              exec: {command: [sleep, "8"]}   # the ingress stops sending requests before the server gets SIGTERM
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
          startupProbe:                            # schema upgrades and backfills run before the server answers; give them 5 minutes, not 75 s
            httpGet: {path: /livez, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /livez, port: 8000}   # not /healthz: a database outage must not restart the app
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: fabulist
  namespace: fabulist
  labels:
    app: fabulist
spec:
  selector:
    app: fabulist
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fabulist
  namespace: fabulist
spec:
  ingressClassName: traefik
  rules:
    - host: FABULIST_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fabulist
                port:
                  number: 80
