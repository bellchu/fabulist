# Prometheus Operator and Grafana sidecar objects (kube-prometheus-stack).
# Labels match this cluster's selectors: release=kube-prom-stack, grafana_dashboard=1.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fabulist
  namespace: fabulist
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: fabulist
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization:
        type: Bearer
        credentials:
          name: fabulist-app
          key: METRICS_TOKEN
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fabulist
  namespace: fabulist
  labels:
    release: kube-prom-stack
spec:
  groups:
    - name: fabulist
      rules:
        - alert: FabulistDown
          expr: up{namespace="fabulist", job="fabulist"} == 0 or absent(up{namespace="fabulist", job="fabulist"})
          for: 5m
          labels: {severity: critical, team: fabulist}
          annotations:
            summary: Fabulist is not reachable by Prometheus
            runbook: "README.md#runbook: check pod status, logs and the database"
        - alert: FabulistDatabaseUnavailable
          expr: fabulist_database_up == 0
          for: 2m
          labels: {severity: critical, team: fabulist}
          annotations:
            summary: Fabulist is running but cannot reach its database (users get 503s)
            runbook: "README.md#runbook: check postgres-0 and its volume; the app reconnects by itself when the database returns"
        - alert: FabulistMemoryNearLimit
          expr: fabulist_memory_limit_bytes > 0 and fabulist_process_resident_memory_bytes / fabulist_memory_limit_bytes > 0.85
          for: 10m
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: Fabulist is using over 85% of its memory limit and will be killed (OOM) if it grows
            runbook: "README.md#runbook: look for very large projects or exports in progress, then raise the pod memory limit"
        - alert: FabulistRunQueueBacklog
          expr: fabulist_queued_runs > 20
          for: 30m
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: More than 20 AI runs have been waiting for a free slot for 30 minutes
            runbook: "README.md#runbook: runs are slow or stuck (check the AI provider), or MAX_CONCURRENT_RUNS is too low for the demand"
        - alert: FabulistAuthFailureSpike
          expr: sum(increase(fabulist_auth_failures_total[10m])) > 50
          for: 5m
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: Many failed sign-ins or API token attempts (possible credential stuffing)
            runbook: "README.md#runbook: filter the JSON logs for 'failed sign-in', check the source IPs, rotate or disable the targeted account"
        - alert: FabulistHighErrorRate
          expr: sum(rate(fabulist_http_requests_total{status=~"5.."}[10m])) / clamp_min(sum(rate(fabulist_http_requests_total[10m])), 1e-9) > 0.05
          for: 10m
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: More than 5% of Fabulist requests fail with 5xx
            runbook: "README.md#runbook: inspect JSON logs for status>=500 and database health"
        - alert: FabulistAIRunsFailing
          expr: increase(fabulist_runs_total{status="failed"}[1h]) > 3
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: Several AI runs failed in the last hour
            runbook: "README.md#runbook: test the default AI provider in Admin > AI providers"
        - alert: FabulistDependencyAudit
          expr: kube_job_status_failed{namespace="fabulist", job_name=~"fabulist-dep-audit.*"} > 0
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: The weekly dependency audit found vulnerable Python packages (or could not run)
            runbook: "README.md#runbook: read the fabulist-dep-audit job log, upgrade pins, run scripts/test.sh, redeploy"
        - alert: FabulistBackupMissing
          expr: time() - kube_cronjob_status_last_successful_time{namespace="fabulist", cronjob="fabulist-backup"} > 26 * 3600
          for: 30m
          labels: {severity: warning, team: fabulist}
          annotations:
            summary: No successful Fabulist database backup in 26 hours
            runbook: "README.md#runbook: inspect the fabulist-backup job logs and the backups volume"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fabulist-dashboard
  namespace: fabulist
  labels:
    grafana_dashboard: "1"
data:
  fabulist.json: |
    {
     "title": "Fabulist",
     "uid": "fabulist-overview",
     "schemaVersion": 39,
     "time": {
      "from": "now-24h",
      "to": "now"
     },
     "refresh": "1m",
     "templating": {
      "list": [
       {
        "name": "datasource",
        "type": "datasource",
        "query": "prometheus",
        "label": "Data source"
       }
      ]
     },
     "panels": [
      {
       "type": "stat",
       "title": "Projects",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_projects",
         "refId": "A"
        }
       ]
      },
      {
       "type": "stat",
       "title": "BRD documents",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_documents",
         "refId": "A"
        }
       ]
      },
      {
       "type": "stat",
       "title": "Requirements",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 8,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_requirements",
         "refId": "A"
        }
       ]
      },
      {
       "type": "stat",
       "title": "Stories",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_stories",
         "refId": "A"
        }
       ]
      },
      {
       "type": "stat",
       "title": "Runs in progress",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 16,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_running_runs",
         "refId": "A"
        }
       ]
      },
      {
       "type": "stat",
       "title": "Up",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 20,
        "y": 0,
        "w": 4,
        "h": 4
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "up{namespace=\"fabulist\",job=\"fabulist\"}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Requests by status",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (status) (rate(fabulist_http_requests_total[5m]))",
         "legendFormat": "{{status}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "p95 latency by route",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 4,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "s"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "histogram_quantile(0.95, sum by (le, route) (rate(fabulist_http_request_duration_seconds_bucket[5m])))",
         "legendFormat": "{{route}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "AI runs",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (stage, status) (increase(fabulist_runs_total[1h]))",
         "legendFormat": "{{stage}} {{status}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "LLM tokens per hour",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 12,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (direction) (increase(fabulist_llm_tokens_total[1h]))",
         "legendFormat": "{{direction}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Tracker pushes",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 20,
        "w": 24,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (tracker, result) (increase(fabulist_tracker_items_total[1h]))",
         "legendFormat": "{{tracker}} {{result}}",
         "refId": "A"
        }
       ]
      },
      {
       "type": "row",
       "title": "Reliability and security",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 28,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "stat",
       "title": "Database",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 29,
        "w": 4,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "0": {
             "text": "UNREACHABLE",
             "color": "red"
            },
            "1": {
             "text": "Connected",
             "color": "green"
            }
           }
          }
         ],
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "colorMode": "background",
        "graphMode": "none"
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_database_up",
         "refId": "A"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Failed sign-ins and token attempts (per 10 min)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 4,
        "y": 29,
        "w": 10,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "sum by (kind) (increase(fabulist_auth_failures_total[10m]))",
         "refId": "A",
         "legendFormat": "{{kind}}"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Edit conflicts (1 h) and database 503s (5 min)",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 14,
        "y": 29,
        "w": 10,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "increase(fabulist_edit_conflicts_total[1h])",
         "refId": "A",
         "legendFormat": "edit conflicts"
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "increase(fabulist_database_unavailable_total[5m])",
         "refId": "B",
         "legendFormat": "database 503s"
        }
       ]
      },
      {
       "type": "row",
       "title": "Capacity",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 37,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "AI runs: running and waiting in the queue",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 0,
        "y": 38,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_running_runs",
         "refId": "A",
         "legendFormat": "running"
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_queued_runs",
         "refId": "B",
         "legendFormat": "waiting for a slot"
        }
       ]
      },
      {
       "type": "timeseries",
       "title": "Memory against the container limit",
       "datasource": {
        "type": "prometheus",
        "uid": "${datasource}"
       },
       "gridPos": {
        "x": 12,
        "y": 38,
        "w": 12,
        "h": 8
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes"
        },
        "overrides": []
       },
       "targets": [
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_process_resident_memory_bytes",
         "refId": "A",
         "legendFormat": "resident"
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_process_peak_resident_memory_bytes",
         "refId": "B",
         "legendFormat": "peak since start"
        },
        {
         "datasource": {
          "type": "prometheus",
          "uid": "${datasource}"
         },
         "expr": "fabulist_memory_limit_bytes",
         "refId": "C",
         "legendFormat": "limit"
        }
       ]
      }
     ],
     "tags": [
      "fabulist"
     ]
    }
